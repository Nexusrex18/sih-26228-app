[project]
name = "cva"
version = "0.1.0"
description = "Trustworthy CV Integrity Assurance — Module A (data integrity) and Module B (model integrity)"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6.0",          # CVE-2025-32434: weights_only=True only fully safe from 2.6.0
  "onnx>=1.15", "onnxruntime>=1.17", "numpy>=1.26", "scipy>=1.11",
  "matplotlib>=3.8", "pillow>=10",
]

[project.optional-dependencies]
# Module A (data integrity). cleanlab is AGPL-3.0-or-later — accepted, backend_plan.md §5.12.
# Each dependency still owes ADR-006's disconnected-sandbox smoke test before release.
data = ["imagehash>=4.3", "cleanlab>=2.6", "adversarial-robustness-toolbox>=1.17",
        "scikit-learn>=1.3", "pyyaml>=6.0"]

# Module C seal SDK — the whole runtime budget (plan §2.1): cryptography + rfc8785 + stdlib.
provenance = ["cryptography>=42", "rfc8785>=0.1.4"]
provenance-dev = ["pytest>=8", "hypothesis>=6", "ruff", "mypy"]

# Flat layout with several top-level directories (cva, attacklab, profiles, tests, artifacts):
# without this, setuptools refuses to guess and `pip install -e .` fails. Ship the scanner
# package and the attack lab; the tests, profiles and build artefacts are not packages.
[tool.setuptools.packages.find]
include = ["cva*", "attacklab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
