[project]
name = "cva"
version = "0.1.0"
description = "Trustworthy CV Integrity Assurance — Module B (model integrity)"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6.0",          # CVE-2025-32434: weights_only=True only fully safe from 2.6.0
  "onnx>=1.15", "onnxruntime>=1.17", "numpy>=1.26", "scipy>=1.11",
  "matplotlib>=3.8", "pillow>=10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
