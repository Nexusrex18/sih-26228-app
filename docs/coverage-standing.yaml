# The standing half of the coverage statement.
#
# Code declares what it does; humans declare what the code depends on. Everything in
# `report.json`'s `coverage` block except this file is GENERATED by walking the detector
# registry — it cannot be edited into saying more than the registry supports. This file is
# the other half: the assumptions and residuals that no registry walk can discover, one
# small reviewed file, merged by `cva.report.report_json.standing_limitations()` and printed
# in every report and every coverage statement.
#
# Rules for editing:
#   * A change needs a second reader. Update `reviewed_by` and `reviewed_at` in the same
#     commit; the report prints both, so a stale review is visible to whoever reads a scan.
#   * Every entry names the plan section it comes from. If you cannot cite one, it is not a
#     standing limitation yet — it is an opinion.
#   * Say what is NOT established. An entry that reassures belongs in the product copy.
#   * Keep each `text` a self-contained statement: it is printed on its own, next to
#     entries from other modules, to a reader who has not read this file.

schema_version: "1.0.0"
reviewed_by: ["tanmay0996", "PENDING-SECOND-READER"]
reviewed_at: "2026-09-21"

# The one sentence the whole system is bounded by (Consolidated/13). It is printed first.
invariant: >-
  We detect poisoning that leaves a regularity in pixel, frequency, label-neighbourhood or
  activation space. Poisoning engineered to carry its regularity only in a space we do not
  measure is invisible to us, and a scan that finds nothing is a statement about the spaces
  that were measured, never a statement that the data is clean.

limitations:

  # --- Module C — provenance and the seal (Module C plan §14) -------------------------
  - id: prov.key-from-the-start
    module: C
    source: "Module-C-Provenance-Seal-Plan.md §14"
    text: >-
      An adversary holding the signing key from the start can forge a wholly consistent
      history, and it will verify. The mitigation is an HSM or secure element and
      two-person custody — a deployment decision, not something this tool can check.

  - id: prov.sensor-to-sdk
    module: C
    source: "Module-C-Provenance-Seal-Plan.md §14"
    text: >-
      Tampering between the sensor and the SDK is outside the seal. The SDK signs what it is
      handed: a perfectly sealed record of a doctored input is still a perfectly sealed
      record.

  - id: prov.unwitnessed-window
    module: C
    source: "Module-C-Provenance-Seal-Plan.md §14 (D11)"
    text: >-
      Tail truncation and split-view within an anchoring interval are not visible in band.
      Records after the last anchor still trust the key holder; the size of that unwitnessed
      window is printed in every report and is the bound on insider-grade assurance.

  - id: prov.selective-logging
    module: C
    source: "Module-C-Provenance-Seal-Plan.md §14 (13-C1)"
    text: >-
      Selective logging is not detectable in band: if the SDK is never called there is no
      gap to find. Closing it needs an independent expected-count or a two-phase mode, which
      is an integration requirement on the operator rather than a property of this tool.

  - id: prov.backdating
    module: C
    source: "Module-C-Provenance-Seal-Plan.md §14"
    text: >-
      Absolute time is bounded only where a witness statement exists. Within an anchoring
      window, ordering is relative and backdating inside that window is not detectable.

  - id: prov.durability-window
    module: C
    source: "Module-C-Provenance-Seal-Plan.md §14"
    text: >-
      Records lost to a power cut inside the group-commit durability window leave no in-chain
      trace. The window is declared in every verification result.

  - id: prov.trust-root-and-revocation
    module: C
    source: "Module-C-Provenance-Seal-Plan.md §14"
    text: >-
      The trust root is not self-proving: it is verified out of band, and emergency
      revocation of a compromised key needs an out-of-band trust-root update. The bundle
      shipping a trust root is an assumption about the bundle, not a proof about the key.

  - id: prov.recompute-scope
    module: C
    source: "Module-C-Provenance-Seal-Plan.md §14"
    text: >-
      Cross-environment recompute establishes the decision-level claim (R1). A bitwise claim
      (R0) holds only where runtimes match, and a boundary_flip is reported as review, never
      as proof of tampering.

  # --- Module E — governance, the dashboard, the audit ledger (Module E plan §13) ------
  - id: gov.tool-asserted-attribution
    module: E
    source: "Module-E-Governance-Network-Plan.md §13 (D-E14)"
    text: >-
      Analyst attribution is by the recording tool, not by the analyst's own key. actor_id is
      asserted by cva-web after local authentication, so anyone holding the cva-web account
      and a valid session could record a decision as that user. Per-analyst signing keys
      would close this and need key distribution on an air gap; until then it is declared.

  - id: gov.local-accounts-only
    module: E
    source: "Module-E-Governance-Network-Plan.md §13"
    text: >-
      Accounts are local: there is no identity provider on an air gap. Compromise of an
      analyst account is not detectable by the ledger, which records what the account did
      and cannot know who was holding it.

  - id: gov.ledgerd-host-account
    module: E
    source: "Module-E-Governance-Network-Plan.md §13"
    text: >-
      A compromised cva-ledgerd host account signs whatever it is told. That residual is what
      an HSM, the anchoring ceremony and two-person custody address; no part of the dashboard
      bounds it.

  - id: gov.untrusted-clock
    module: E
    source: "Module-E-Governance-Network-Plan.md §13"
    text: >-
      The host clock is untrusted. Every displayed time is labelled as coming from it, and
      ordering — in the audit trail and in the effective-state fold — is by ledger seq, never
      by time.

  - id: gov.login-events-not-in-the-ledger
    module: E
    source: "Module-E-Governance-Network-Plan.md §13"
    text: >-
      Login, lockout and role-change events go to the application log and not to the audit
      ledger in this version. The ledger holds decisions, not sessions.

  - id: gov.remediation-claims
    module: E
    source: "Module-E-Governance-Network-Plan.md §7.5"
    text: >-
      A re-scan of a remediated dataset reports what was checked under one profile. It is
      never a statement that the dataset is clean, fixed or safe, and the interface does not
      use those words.

  # --- Modules A, B, D — what the detectors themselves depend on ----------------------
  - id: data.near-dup-evasion
    module: A
    source: "Module-A-Data-Integrity-Plan.md §6.1"
    text: >-
      Near-duplicate detection is weak against duplicates crafted to evade both perceptual
      hashing and embedding similarity at once. It finds flooding and pipeline artefacts
      reliably; it does not bound an adversary who knows both methods.

  - id: data.metadata-is-forgeable
    module: A
    source: "Module-A-Data-Integrity-Plan.md §6.x"
    text: >-
      Metadata-based checks catch carelessness and pipeline artefacts, not a motivated
      adversary: anyone who knows we read a field can write it. Every finding that used one
      says so.

  - id: model.trigger-assumption
    module: B
    source: "Module-B-Model-Integrity-Plan.md §6.5"
    text: >-
      Trigger reconstruction assumes a trigger concentrates into a small pixel-space mask.
      Adaptive or distributed triggers that do not concentrate, and semantic or natural
      triggers, are outside what that assumption can express at all. Full-class mode is
      infeasible at high class counts; top-K mitigates the cost and does not remove the gap.

  - id: model.generated-reference-is-bounded
    module: B
    source: "Module-B-Model-Integrity-Plan.md §7"
    text: >-
      A generated reference battery helps only when the contributed model's task family
      matches an architecture shipped with it. Findings that used one are compared against a
      generic reference of the same family, not against this model's own declared reference,
      and they say so.

  - id: drift.conservative-basis
    module: D
    source: "Module-D-Drift-Detection-Plan.md §6"
    text: >-
      Drift results computed against an augmentation basis rather than a declared reference
      distribution are weighted conservatively, and that basis is stated with the result.

  # --- Cross-cutting, and the honest statements about the tool itself ------------------
  - id: xcut.no-reference-residual
    module: cross
    source: "Consolidated/16; Module-B-Model-Integrity-Plan.md §7"
    text: >-
      A backdoor present since original training, with no registered manifest and no
      reference battery, has nothing to be anomalous against. This is the system's largest
      single blind spot. Registering the emitted reference manifest at acceptance closes it
      for every future scan of that model, and not before.

  - id: xcut.detection-rates-are-our-own
    module: cross
    source: "Consolidated/13"
    text: >-
      Detection rates are measured against our own attack families and do not generalise to
      attacks outside them. External validation against TrojAI or BackdoorBench is a
      separate, required step that has not been performed for this build.

  - id: xcut.contributor-aggregation-is-synthetic
    module: cross
    source: "Module-E-Governance-Network-Plan.md §7.8"
    text: >-
      Contributor-level aggregation is demonstrated on synthetic contributor assignment. The
      statistics are sound; the evidence that they behave as expected on real contributed
      corpora is not yet in hand.

  - id: xcut.format-extension-points
    module: cross
    source: "ADR-001"
    text: >-
      The format extension points declared in ADR-001 are declared, not hidden: a format we
      do not parse is reported as unparsed rather than silently treated as inert.

  - id: xcut.tool-itself
    module: cross
    source: "Consolidated/13 Part D"
    text: >-
      Compromise of the assurance tool itself is outside what the assurance tool can detect.
      The bundle's own integrity is established by the vendoring manifest and the trust root
      shipped with it, both verified out of band.
